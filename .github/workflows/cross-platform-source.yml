name: Cross-platform Source CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    name: Package on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect source
        shell: bash
        run: |
          echo "Platform: $RUNNER_OS"
          echo "Project: Darkness of Lightness"
          git status --short
          test -f README.md

      - name: Package source
        shell: bash
        env:
          ARTIFACT_NAME: DarknessOfLightness-source-${{ matrix.os }}
        run: |
          git archive --format=zip --output="$ARTIFACT_NAME.zip" HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: DarknessOfLightness-${{ matrix.os }}
          path: DarknessOfLightness-source-${{ matrix.os }}.zip
          if-no-files-found: error
          retention-days: 30
